dependencies {
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    // Use org.json for compile only in base to avoid packaging it into Android; desktop adds it at runtime.
    compileOnly 'org.json:json:20250517'
    testImplementation 'org.json:json:20250517'
    // ONNX Runtime for the optional Basic Pitch multi-pitch detector. compileOnly so it is not
    // packaged into Android (which gets its own, source-built runtime); desktop adds it at runtime.
    compileOnly 'com.microsoft.onnxruntime:onnxruntime:1.22.0'
    testImplementation 'com.microsoft.onnxruntime:onnxruntime:1.22.0'
}

test {
    // Enables the use of JUnit 5 (JUnit Platform) for testing.
    // Long-running benchmark/optimization tests are tagged "slow" and excluded here;
    // run them explicitly with: ./gradlew :base:slowTest
    useJUnitPlatform {
        excludeTags 'slow', 'benchmark'
    }
}

tasks.register('pitchBenchmark', Test) {
    description = 'Runs the pitch detection benchmark on synthetic signals and writes build/reports/pitch-benchmark/report.md.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    systemProperty 'pitchBenchmark.reportDir', layout.buildDirectory.dir('reports/pitch-benchmark').get().asFile.absolutePath
    // A benchmark is never up to date: always re-run and show the report on the console.
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('slowTest', Test) {
    description = 'Runs long-running benchmark and optimization tests (tagged "slow").'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
    }
}
