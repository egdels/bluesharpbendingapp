name: Build ONNX Runtime for Android
description: >
  Builds the reduced ONNX Runtime for the Basic Pitch chord engine from the external/onnxruntime
  submodule (scripts/build_onnxruntime_android.sh) and caches the result. Produces
  android/app/src/main/jniLibs/<abi>/*.so and android/app/libs/onnxruntime-*.jar.

runs:
  using: composite
  steps:
    - name: Compute cache key
      id: key
      shell: bash
      run: |
        ORT_SHA=$(git rev-parse HEAD:external/onnxruntime)
        echo "ort_sha=$ORT_SHA" >> "$GITHUB_OUTPUT"

    - name: Restore ONNX Runtime build
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          android/app/src/main/jniLibs
          android/app/libs/onnxruntime-*.jar
        # The action itself is part of the key: a change of the build tools must rebuild, not reuse
        # libraries built with other tools.
        key: ort-android-${{ steps.key.outputs.ort_sha }}-${{ hashFiles('scripts/build_onnxruntime_android.sh', 'scripts/onnxruntime/nmp.required_operators.config', 'external/onnxruntime_pinned/**', '.github/actions/build-onnxruntime-android/action.yml') }}

    - name: Check out the ONNX Runtime submodule
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git submodule update --init --depth 1 external/onnxruntime
        git -C external/onnxruntime submodule update --init --depth 1 cmake/external/onnx

    - name: Set up Python
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools (CMake 3.31.6, Ninja, zip, flatbuffers, NDK)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Same tools as the F-Droid recipe (apt: ninja-build, zip, unzip), so the reproducible
        # F-Droid build gets the same generator and jar processing as CI.
        sudo apt-get update -qq
        sudo apt-get install -y -qq ninja-build zip unzip
        python3 -m pip install --upgrade pip
        python3 -m pip install "cmake==3.31.6" flatbuffers
        NDK_DIR="$ANDROID_HOME/ndk/28.0.13004108"
        if [ ! -d "$NDK_DIR" ]; then
          # Composite steps run with "bash -eo pipefail": "yes" ends with SIGPIPE once sdkmanager
          # exits, which pipefail would turn into a failure. Check the result explicitly instead.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.0.13004108" > /dev/null
          set -o pipefail
        fi
        test -f "$NDK_DIR/source.properties" || { echo "NDK 28.0.13004108 not installed" >&2; exit 1; }
        echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "ORT_CMAKE=$(command -v cmake)" >> "$GITHUB_ENV"

    - name: Build ONNX Runtime
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: ./scripts/build_onnxruntime_android.sh

    - name: Show ONNX Runtime libraries
      shell: bash
      run: |
        ls -la android/app/libs/
        find android/app/src/main/jniLibs -name '*.so' -exec ls -la {} \;
