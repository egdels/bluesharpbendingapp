version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Gradle 9 needs a newer major version of the Android Gradle Plugin (8.12 fails to load);
      # take it on together with that migration.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # From 1.24 on, the Maven artifact no longer bundles natives for Intel Macs (osx-x64), for
      # which CI builds a desktop installer; 1.23.x is the newest version covering all platforms.
      - dependency-name: "com.microsoft.onnxruntime:onnxruntime"
        versions: [">= 1.24"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
