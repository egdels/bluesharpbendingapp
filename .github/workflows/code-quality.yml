name: Code Quality

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check code formatting (Spotless)
      run: ./gradlew spotlessCheck

    - name: Compile all modules with Error Prone
      run: ./gradlew :base:compileJava :desktop:compileJava :webapp:compileJava :android:compileDebugJavaWithJavac

    # The desktop UI tests (TestFX) need a display; run them on a virtual X server.
    - name: Install Xvfb
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb libgtk-3-0t64

    - name: Run Base and Desktop tests
      run: xvfb-run -a ./gradlew :base:test :desktop:test

    - name: Run Android unit tests
      run: ./gradlew :android:testDebugUnitTest

    - name: Run Webapp tests
      run: ./gradlew :webapp:test

    - name: Run Android Lint
      run: ./gradlew :android:lintDebug

    - name: Generate JaCoCo test coverage report
      run: ./gradlew :android:jacocoTestReport

    - name: Upload Lint report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lint-report
        path: android/app/build/reports/lint-results-debug.html
        retention-days: 14

    - name: Upload Base test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: base-test-results
        path: base/build/reports/tests/test/
        retention-days: 14

    - name: Upload Desktop test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: desktop-test-results
        path: desktop/build/reports/tests/test/
        retention-days: 14

    - name: Upload Android test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-test-results
        path: android/app/build/reports/tests/testDebugUnitTest/
        retention-days: 14

    - name: Upload Webapp test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: webapp-test-results
        path: webapp/build/reports/tests/test/
        retention-days: 14

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: android/app/build/reports/jacoco/jacocoTestReport/
        retention-days: 14
