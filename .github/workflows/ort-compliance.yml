name: ORT Compliance

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ort-analyze-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # ORT >= 89 is built with and requires Java 25. The Gradle Inspector
          # is pinned to Java 21 via ort/config/config.yml (javaVersion option).
          java-version: "25"

      - name: Install ORT
        run: |
          # Pinned: a new ORT release can add analyzers or checks that fail the job unnoticed.
          ORT_VERSION=97.2.0
          # The release asset's URL directly: asking the API for it, unauthenticated from a shared
          # runner, can hit the rate limit and return an error without assets (jq: "Cannot iterate
          # over null"). -f fails the step on an HTTP error instead of extracting an error page.
          curl -fsSL -o ort.tgz \
            "https://github.com/oss-review-toolkit/ort/releases/download/${ORT_VERSION}/ort-${ORT_VERSION}.tgz"
          tar -xzf ort.tgz
          sudo mv ort-*/ /opt/ort
          sudo ln -s /opt/ort/bin/ort /usr/local/bin/ort

      - name: Run ORT (Analyze + Report)
        run: |
          chmod +x scripts/run-ort.sh
          ./scripts/run-ort.sh

      - name: Upload ORT artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ort-reports
          path: ort-out/

  scancode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ScanCode
        run: |
          # plugincode 32 finds no hooks with pluggy 1.7 ("did not find any 'pre_scan' hooks").
          pip install "scancode-toolkit==32.5.0" "pluggy<1.7"
          scancode --version

      - name: Run ScanCode
        run: |
          chmod +x scripts/run-scancode.sh
          ./scripts/run-scancode.sh

      - name: Upload ScanCode artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scancode-reports
          path: ort-out/scancode/
